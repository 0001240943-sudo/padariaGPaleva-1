<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Entrar | ThermoFire</title>
  <link rel="stylesheet" href="stylle.css">
</head>
<body>
  <div class="auth">
    <div class="auth-left">
      <div class="auth-logo">
        <div class="auth-logo-icon">🔥</div>
        <div><h2>ThermoFire</h2><small>PADARIA ALEVA BARROSO</small></div>
      </div>
      <h1>O cuidado artesanal.<br><span>Com mais consistência.</span></h1>
      <p>Acompanhe a temperatura, organize suas fornadas e registre a experiência de cada dia.</p>
    </div>
    <div class="auth-right">
      <form class="auth-form" id="login-form">
        <h2>Bem-vindo de volta</h2>
        <p>Acesse sua conta</p>
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="login-email" placeholder="voce@padaria.com.br" required>
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="login-senha" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary">Entrar no ThermoFire →</button>
        <div class="auth-footer">
          <p>Primeiro acesso? <a href="cadastro.html">Criar conta</a></p>
        </div>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
